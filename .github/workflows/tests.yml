name: Synthetic checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Standard-library tests (no game data)
        env:
          USAGA_TEST_WORK: ${{ runner.temp }}/usaga-synthetic-tests
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -I -B -S tests/run_tests.py
